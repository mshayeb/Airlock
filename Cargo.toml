[workspace]
resolver = "2"
members = [
  "crates/airlock-proto",
  "crates/airlock-policy",
  "crates/airlock-broker",
  "crates/airlock-vmm",
  "crates/airlockd",
  "crates/airlock-guestd",
  "crates/airlock-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Phase 1 M0/Scaffold uses pure Rust `std` + workspace path dependencies so all
# crates build and test cleanly in offline/read-only-HOME environments.
