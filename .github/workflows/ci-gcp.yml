name: Airlock CI (Pytest + Google Cloud)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_kvm_runner:
        description: "Run ephemeral nested-KVM self-hosted verification job"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: Stage 1 — Fast Pytest Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build airlock CLI binary
        run: cargo build -p airlock-cli

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install pytest in uv virtualenv
        run: |
          uv venv --allow-existing .venv
          uv pip install --python .venv/bin/python "pytest>=8.0"

      - name: Run Stage 1 pytest smoke suite
        env:
          PYTHON_BIN: .venv/bin/python
          JUNIT_DIR: reports
        run: ./scripts/ci-pytest.sh --stage smoke

      - name: Upload smoke JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-smoke
          path: reports/junit-smoke.xml

  more-tests:
    name: Stage 2 — Rust Workspace & Full Pytest Matrix (${{ matrix.os }})
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build & sign macOS Virtualization helper
        if: runner.os == 'macOS'
        run: sh "macos/airlock-vz-helper/build.sh"

      - name: Run Rust workspace unit tests
        run: cargo test --workspace

      - name: Build airlock CLI binary
        run: cargo build -p airlock-cli

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install pytest in uv virtualenv
        run: |
          uv venv --allow-existing .venv
          uv pip install --python .venv/bin/python "pytest>=8.0"

      - name: Run Stage 2+ pytest suites (unit -> integration -> security)
        env:
          PYTHON_BIN: .venv/bin/python
          JUNIT_DIR: reports
        run: ./scripts/ci-pytest.sh --stage more

      - name: Upload matrix JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-more-${{ matrix.os }}
          path: reports/junit-*.xml

  kvm-self-hosted:
    name: Stage 2B — Ephemeral GCE Nested-KVM Runner Verification
    needs: smoke
    if: ${{ inputs.run_kvm_runner == true || vars.ENABLE_KVM_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, x64, airlock-kvm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build airlock CLI & run workspace unit tests
        run: |
          cargo build -p airlock-cli
          cargo test --workspace

      - name: Verify /dev/kvm, firecracker, jailer, and mkfs.erofs via airlock doctor
        run: |
          out="$(./target/debug/airlock doctor --json)"
          echo "$out"
          python3 -c '
          import json, sys
          data = json.loads(sys.argv[1])
          statuses = {c["check"]: c["status"] for c in data["checks"]}
          for req in ("linux_kvm", "firecracker", "jailer", "mkfs.erofs"):
              assert statuses.get(req) == "ALLOW", f"{req} expected ALLOW, got {statuses.get(req)}"
          ' "$out"

  gcp-cloud-build:
    name: Stage 3 — Google Cloud Build & Nested-KVM Gate
    needs: more-tests
    if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_CI_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Airlock Cloud Build pipeline
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'us-west1' }}
          GCP_KVM_WORKER_POOL: ${{ vars.GCP_KVM_WORKER_POOL }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$GCP_KVM_WORKER_POOL" ]; then
            gcloud builds submit . \
              --config=cloudbuild.yaml \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --worker-pool="$GCP_KVM_WORKER_POOL" \
              --substitutions="_GIT_SHA=$GIT_SHA"
          else
            gcloud builds submit . \
              --config=cloudbuild.yaml \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --substitutions="_GIT_SHA=$GIT_SHA"
          fi
