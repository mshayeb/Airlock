[pytest]
minversion = 8.0
testpaths =
    tests/pytest
    sdks/python/tests
pythonpath = sdks/python
addopts = --strict-markers -ra
markers =
    smoke: Fast (<5s) Stage-1 CI gate verifying CLI binary, doctor check, manifest init, and SDK import
    unit: Stage-2 isolated unit tests for AirlockClient, Chamber guards, and agent harness adapters
    integration: Stage-2 end-to-end tests over a live AF_UNIX mock airlockd server and CLI workflows
    security: Stage-3 acceptance tests for audit hash-chain tamper detection (AT-11), WCAG/NO_COLOR (AT-13), spaces (AT-14), and VMM zero-NIC invariants
